services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ottodot
      POSTGRES_USER: ottodot
      POSTGRES_PASSWORD: ottodot
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottodot -d ottodot"]
      interval: 3s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ottodot:ottodot@db:5432/ottodot
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && python -m backend.app.seed && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
