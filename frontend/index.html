<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ottodot Trial Booking</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><p class="eyebrow">Ottodot</p><h1>Book a science or math trial class</h1><p class="intro">Choose a child and class. Payment is simulated so the booking rules remain easy to inspect.</p></header><section class="card"><h2>New booking</h2><div class="fields"><label>Child<select id="student"></select></label><label>Trial class<select id="trial-class"></select></label></div><p id="availability" class="muted"></p><button id="book">Book trial</button></section><section id="payment-card" class="card hidden"><h2>Payment simulation</h2><p>Booking <strong id="booking-id"></strong> is waiting for payment.</p><button id="pay-success">Payment success</button> <button id="pay-failure" class="secondary">Payment failure</button></section><section class="card"><div class="row"><h2>Booking status</h2><span id="status" class="status">No booking yet</span></div><p id="message" class="muted"></p></section><section class="card"><div class="row"><h2>Confirmed roster</h2><button id="refresh" class="link">Refresh</button></div><ol id="roster"><li>Select a class to load its roster.</li></ol></section></main><script src="app.js"></script></body></html>
